name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Run frontend tests
        run: npm run test:frontend

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Install Ruff
        run: python -m pip install ruff==0.17.4
      - name: Lint Python
        run: ruff check --select E4,E7,E9,F server tests/backend
      - name: Run backend tests
        run: python -m unittest discover -s tests/backend -p 'test_*.py'

  reuse:
    name: REUSE license compliance
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install REUSE
        run: python -m pip install reuse==6.2.0
      - name: Check license and copyright metadata
        run: reuse lint
